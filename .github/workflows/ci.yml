# Her pull request'te ve main'e her push'ta otomatik kontrol (CEN315 Hafta 3: CI pipeline).
# Sıra: statik analiz -> testler + coverage -> özet tablo -> coverage raporu (indirilebilir)
name: CI

on:
  # Dallarda PR yeter, aynı commit iki kez test edilmesin
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Paketleri kur
        run: pip install -r requirements-dev.txt

      - name: Statik analiz (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Testler + branch coverage (pytest)
        run: |
          set -o pipefail
          python -m pytest --cov=app --cov-branch --cov-report=term --cov-report=html | tee pytest.log

      - name: Görev özeti
        if: always()
        run: python scripts/check.py --summary >> "$GITHUB_STEP_SUMMARY"

      - name: Coverage raporunu yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov
          if-no-files-found: ignore
