[project]
name = "petition-system"
version = "0.1.0"
description = "CEN317 Engineering Design — imza kampanyası platformu"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
# -r fEX: özetde başarısız (f), hata (E) ve "beklenmedik şekilde geçti" (X) testleri göster
addopts = "-rfEX --strict-markers"
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# B008: FastAPI'de Form(...) varsayılan değer olarak kullanılır, bu normaldir.
ignore = ["B008"]
